<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — The Desi Chapter</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="marquee-bar"><div class="marquee-track" id="marqueeTrack"></div></div>
<div class="util-nav">
  <button onclick="history.back()">&larr; Back</button>
  <a href="index.html">&#8962; Home</a>
</div>

<header class="site-header">
  <div class="header-row">
    <div class="header-side left">
      <button class="hamburger" id="menuBtn" aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
    <a href="index.html" class="brand"><img data-brand-logo src="assets/logo.png" alt="The Desi Chapter" style="height:40px;"></a>
    <div class="header-side right">
      <a class="icon-link" href="login.html" title="Login"><svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <button class="icon-link" id="cartBtn" style="background:none;border:none;"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6h15l-1.5 9h-12z" stroke="currentColor" stroke-linejoin="round"/><path d="M6 6L5 3H2" stroke="currentColor" stroke-linecap="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="18" cy="20" r="1.4" fill="currentColor"/></svg><span class="cart-count">0</span></button>
      <a class="icon-link" href="contact.html" title="Contact"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v14H4z" stroke="currentColor"/><path d="M4 6l8 7 8-7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>
  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="navDrawer">
  <button class="drawer-close" id="drawerCloseBtn" aria-label="Close menu">&times;</button>
  <div class="brand" style="margin-bottom:30px;"><img data-brand-logo src="assets/logo.png" style="height:52px;" alt=""></div>
  <nav><ul id="drawerMenu"></ul></nav>
</aside>

<div class="drawer-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <button class="drawer-close" id="cartCloseBtn" aria-label="Close cart">&times;</button>
  <h3 style="margin-top:6px;">Your Cart</h3>
  <div id="cartItems"></div>
</aside>

<section class="section">
  <div class="container">
    <div class="pd-wrap" id="pdWrap"></div>
  </div>
</section>

<section class="section-tight" style="background:var(--ivory-deep);">
  <div class="container center">
    <div class="eyebrow">You May Also Like</div>
    <h2 style="margin-bottom:26px;">More From The Chapter</h2>
    <div class="grid grid-4" id="relatedGrid"></div>
  </div>
</section>

<div class="size-guide-overlay" id="sizeGuideModal">
  <div class="size-guide-box">
    <button type="button" id="sizeGuideClose" aria-label="Close">&times;</button>
    <div id="sizeGuideModalBody"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid" id="footerContent"></div>
    <div class="footer-bottom">&copy; <span id="footerYear"></span> The Desi Chapter. All rights reserved.</div>
  </div>
</footer>

<script src="js/content-store.js"></script>
<script src="js/main.js"></script>
<script>
(function(){
  const C = window.TDC_CONTENT;
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || (C.products[0] && C.products[0].id);
  const product = C.products.find(p=>p.id===id) || C.products[0];
  let selectedSize = product.sizes[0];
  let qty = 1;

  function stockLine(){
    if(product.availability==='out') return `<span class="badge badge-out">Out of Stock</span>`;
    if(product.availability==='preorder') return `<span class="badge badge-preorder">Pre-order — ships in 2–3 weeks</span>`;
    if(product.availability==='made-to-order') return `<span class="badge badge-made">Made to Order — ships in 1–2 weeks</span>`;
    return `<span class="badge badge-made">In Stock</span>`;
  }

  function mainImageHtml(){
    if(product.image) return `<div class="pd-gallery-main" style="background-image:url('${product.image}');background-size:cover;background-position:center;"></div>`;
    return `<div class="pd-gallery-main pat-${product.palette}">${product.collection}</div>`;
  }

  function render(){
    document.title = product.name + ' — The Desi Chapter';
    document.getElementById('pdWrap').innerHTML = `
      <div>
        ${mainImageHtml()}
        <div class="pd-thumbs">
          <div class="t pat-${product.palette} active"></div>
          <div class="t pat-bagru"></div>
          <div class="t pat-ajrakh"></div>
        </div>
      </div>
      <div>
        <div class="cat" style="color:var(--rust);font-family:var(--f-label);letter-spacing:.1em;font-size:.75rem;text-transform:uppercase;">${product.collection} &middot; ${product.gender}</div>
        <h1 style="margin-top:8px;">${product.name}</h1>
        <div class="price-row" style="margin-bottom:6px;">
          <span class="price" style="font-size:1.3rem;">&#8377;${product.price}</span>
          ${product.mrp>product.price?`<span class="price-strike">&#8377;${product.mrp}</span>`:''}
        </div>
        ${stockLine()}
        <p style="margin-top:18px;color:var(--ink-soft);">${product.description}</p>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;">
          <div class="small-caps" style="color:var(--ink-soft);">Select Size</div>
          <button type="button" id="sizeGuideBtn" style="background:none;border:none;color:var(--rust);font-size:.78rem;text-decoration:underline;cursor:pointer;padding:0;">Size Guide</button>
        </div>
        <div class="size-row" id="sizeRow"></div>

        <div class="small-caps" style="color:var(--ink-soft);">Quantity</div>
        <div class="qty-row">
          <button id="qtyMinus">&minus;</button>
          <span id="qtyVal">1</span>
          <button id="qtyPlus">+</button>
        </div>

        <button class="btn btn-solid btn-block" id="addBtn" ${product.availability==='out'?'disabled':''}>
          ${product.availability==='out' ? 'Out of Stock' : (product.availability==='preorder' ? 'Pre-order Now' : product.availability==='made-to-order' ? 'Order — Made to Order' : 'Add to Cart')}
        </button>
        <p class="helper-text">${product.region ? 'Crafted in ' + product.region + '.' : ''} Nazar-protected label included. Delivered within 7 days.</p>
        <p class="helper-text" style="display:flex;align-items:center;gap:8px;margin-top:10px;">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;flex-shrink:0;" fill="none"><path d="M12 20.5s-7.5-4.9-10-9.6C.5 7.6 2.3 4 5.8 4c2 0 3.6 1.1 4.6 2.6C11.4 5.1 13 4 15 4c3.5 0 5.3 3.6 3.8 6.9-2.5 4.7-10 9.6-10 9.6z" stroke="var(--rust)" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span>${C.productPageInfo.welfareNote}</span>
        </p>

        <div style="margin-top:26px;">
          <details class="acc-item" open><summary>Shipping &amp; Returns</summary><p>${C.productPageInfo.shippingReturnsText} Read our <a href="policies/shipping-policy.html" style="color:var(--rust);">Shipping Policy</a> and <a href="policies/return-exchange.html" style="color:var(--rust);">Return &amp; Exchange Policy</a>.</p></details>
          <details class="acc-item"><summary>Fabric &amp; Care</summary><p>${C.productPageInfo.fabricCareText}</p></details>
          <details class="acc-item"><summary>The Craft</summary><p>Part of our ${product.collection} chapter, rooted in the region of ${product.region}.</p></details>
        </div>
      </div>`;

    // Size guide modal wiring
    const sizeGuideBtn = document.getElementById('sizeGuideBtn');
    if(sizeGuideBtn){
      sizeGuideBtn.addEventListener('click', ()=>{
        const guide = C.sizeGuides.find(g=>g.id===product.sizeGuideId) || C.sizeGuides[0];
        const modal = document.getElementById('sizeGuideModal');
        const body = document.getElementById('sizeGuideModalBody');
        if(guide && guide.image){
          body.innerHTML = `<h3 style="margin-top:0;">${guide.name}</h3><img src="${guide.image}" style="width:100%;border-radius:4px;">`;
        } else {
          body.innerHTML = `<h3 style="margin-top:0;">${guide ? guide.name : 'Size Guide'}</h3><p style="color:var(--ink-soft);">The size chart for this product hasn't been uploaded yet — check back soon, or contact us and we'll help you find the right fit.</p>`;
        }
        modal.style.display = 'flex';
      });
    }

    const sizeRow = document.getElementById('sizeRow');
    sizeRow.innerHTML = product.sizes.map(s=>`<div class="size-box ${s===selectedSize?'active':''}" data-s="${s}">${s}</div>`).join('');
    sizeRow.querySelectorAll('.size-box').forEach(el=>{
      el.addEventListener('click', ()=>{ selectedSize = el.dataset.s; render(); wire(); });
    });

    const related = C.products.filter(p=>p.id!==product.id).slice(0,4);
    document.getElementById('relatedGrid').innerHTML = related.map(p=>`
      <a class="product-card" href="product.html?id=${p.id}">
        ${p.image ? `<div class="thumb" style="background-image:url('${p.image}');background-size:cover;background-position:center;"></div>` : `<div class="thumb pat-${p.palette}">${p.collection}</div>`}
        <div class="info"><div class="cat">${p.collection}</div><h4>${p.name}</h4><div class="price">&#8377;${p.price}</div></div>
      </a>`).join('');
  }

  function wire(){
    document.getElementById('qtyMinus').addEventListener('click', ()=>{ qty = Math.max(1, qty-1); document.getElementById('qtyVal').textContent = qty; });
    document.getElementById('qtyPlus').addEventListener('click', ()=>{ qty = qty+1; document.getElementById('qtyVal').textContent = qty; });
    const addBtn = document.getElementById('addBtn');
    if(addBtn && !addBtn.disabled){
      addBtn.addEventListener('click', ()=>{
        TDC.addToCart(product, selectedSize, qty);
        addBtn.textContent = 'Added ✓';
        setTimeout(()=>{ addBtn.textContent = product.availability==='preorder' ? 'Pre-order Now' : product.availability==='made-to-order' ? 'Order — Made to Order' : 'Add to Cart'; }, 1600);
      });
    }
  }

  const sgModal = document.getElementById('sizeGuideModal');
  document.getElementById('sizeGuideClose').addEventListener('click', ()=>{ sgModal.style.display='none'; });
  sgModal.addEventListener('click', (e)=>{ if(e.target===sgModal) sgModal.style.display='none'; });

  document.addEventListener('DOMContentLoaded', ()=>{ render(); wire(); });
})();
</script>
</body>
</html>
