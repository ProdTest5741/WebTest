<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — The Desi Chapter</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="marquee-bar"><div class="marquee-track" id="marqueeTrack"></div></div>
<div class="util-nav">
  <button onclick="history.back()">&larr; Back</button>
  <a href="index.html">&#8962; Home</a>
</div>

<header class="site-header">
  <div class="header-row">
    <div class="header-side left">
      <button class="hamburger" id="menuBtn" aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
    <a href="index.html" class="brand"><img data-brand-logo src="assets/logo.png" alt="The Desi Chapter" style="height:40px;"></a>
    <div class="header-side right">
      <a class="icon-link" href="login.html" title="Login"><svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <button class="icon-link" id="cartBtn" style="background:none;border:none;"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6h15l-1.5 9h-12z" stroke="currentColor" stroke-linejoin="round"/><path d="M6 6L5 3H2" stroke="currentColor" stroke-linecap="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="18" cy="20" r="1.4" fill="currentColor"/></svg><span class="cart-count">0</span></button>
      <a class="icon-link" href="contact.html" title="Contact"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v14H4z" stroke="currentColor"/><path d="M4 6l8 7 8-7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>
  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="navDrawer">
  <button class="drawer-close" id="drawerCloseBtn" aria-label="Close menu">&times;</button>
  <div class="brand" style="margin-bottom:30px;"><img data-brand-logo src="assets/logo.png" style="height:52px;" alt=""></div>
  <nav><ul id="drawerMenu"></ul></nav>
</aside>

<div class="drawer-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <button class="drawer-close" id="cartCloseBtn" aria-label="Close cart">&times;</button>
  <h3 style="margin-top:6px;">Your Cart</h3>
  <div id="cartItems"></div>
</aside>

<section class="section-tight" style="padding-bottom:0;">
  <div class="container center">
    <div class="eyebrow">The Shop</div>
    <h1>Every Chapter, One Rack</h1>
    <p style="color:var(--ink-soft);max-width:520px;margin:8px auto 0;">Everyday clothing in hand block-printed and hand-embroidered heritage techniques.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="shop-toolbar">
      <div class="chip-row" id="collectionChips"></div>
      <select class="sort-select" id="sortSelect">
        <option value="default">Sort: Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="new">Newest First</option>
      </select>
    </div>
    <div class="grid grid-4" id="shopGrid"></div>
    <p id="emptyMsg" class="center" style="display:none;color:var(--ink-soft);padding:40px 0;">No products found in this collection yet — check back soon.</p>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid" id="footerContent"></div>
    <div class="footer-bottom">&copy; <span id="footerYear"></span> The Desi Chapter. All rights reserved.</div>
  </div>
</footer>

<script src="js/content-store.js"></script>
<script src="js/main.js"></script>
<script>
(function(){
  const C = window.TDC_CONTENT;
  let activeCollection = 'All';
  let sortMode = 'default';

  function fmtBadge(p){
    if(p.availability === 'out') return `<span class="badge badge-out">Out of Stock</span>`;
    if(p.availability === 'preorder') return `<span class="badge badge-preorder">Pre-order</span>`;
    if(p.availability === 'made-to-order') return `<span class="badge badge-made">Made to Order</span>`;
    return '';
  }

  function thumbHtml(p){
    if(p.image){
      return `<div class="thumb" style="background-image:url('${p.image}');background-size:cover;background-position:center;"></div>`;
    }
    return `<div class="thumb pat-${p.palette}">${p.collection}</div>`;
  }

  function card(p){
    return `<a class="product-card reveal" href="product.html?id=${p.id}">
      ${thumbHtml(p)}
      <div class="info">
        <div class="cat">${p.collection} &middot; ${p.gender}</div>
        <h4>${p.name}</h4>
        <div class="price-row">
          <span class="price">&#8377;${p.price}</span>
          ${p.mrp > p.price ? `<span class="price-strike">&#8377;${p.mrp}</span>` : ''}
        </div>
        ${fmtBadge(p)}
      </div>
    </a>`;
  }

  function renderChips(){
    const el = document.getElementById('collectionChips');
    el.innerHTML = C.collections.map(c => `<button class="chip ${c===activeCollection?'active':''}" data-c="${c}">${c}</button>`).join('');
    el.querySelectorAll('.chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{ activeCollection = btn.dataset.c; renderChips(); renderGrid(); });
    });
  }

  function renderGrid(){
    let list = C.products.filter(p => activeCollection==='All' || p.collection===activeCollection);
    if(sortMode==='low') list = [...list].sort((a,b)=>a.price-b.price);
    if(sortMode==='high') list = [...list].sort((a,b)=>b.price-a.price);
    if(sortMode==='new') list = [...list].reverse();
    const grid = document.getElementById('shopGrid');
    grid.innerHTML = list.map(card).join('');
    document.getElementById('emptyMsg').style.display = list.length ? 'none' : 'block';
  }

  document.getElementById('sortSelect').addEventListener('change', (e)=>{ sortMode = e.target.value; renderGrid(); });

  document.addEventListener('DOMContentLoaded', function(){
    renderChips();
    renderGrid();
  });
})();
</script>
</body>
</html>
